{% extends "base.html" %}
{% block title %}Sign up · Movie Recommender{% endblock %}
{% block content %}
<div class="auth">
  <h1>Create an account</h1>
  <p class="lead">Accounts are stored locally in a SQLite database with hashed passwords.</p>
  <form method="post" class="card">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ request.form.email }}" required>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ request.form.username }}" required>
    </div>
    <div class="field">
      <label for="password">Password <span class="muted">(8+ characters)</span></label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" required>
    </div>
    <div class="actions">
      <button class="btn" type="submit">Sign up</button>
      <span class="muted">Have an account? <a href="{{ url_for('login') }}">Log in</a></span>
    </div>
  </form>
</div>
{% endblock %}
